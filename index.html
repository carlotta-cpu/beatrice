<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Una sorpresa per Beatrice</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    touch-action: none;
}
</style>
</head>

<body>
<canvas id="screen"></canvas>

<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

let dpr = 1;
let fase = "rating";
let voto = 0;
let frame = 0;
let tempoInizio = performance.now();
let ultimoFrame = 0;

let messaggioRating = "";
let ratingVaiAvanti = false;
let tempoRating = 0;

let messaggioDomanda = "";

const ROSSO_CHIARO = [255, 35, 55];
const BIANCO = [255, 225, 225];


/* ================================================
   SCHERMO
================================================ */

function scalaSchermo() {
    const s = Math.min(
        window.innerWidth / 950,
        window.innerHeight / 750
    );

    canvas.style.width = `${950 * s}px`;
    canvas.style.height = `${750 * s}px`;

    dpr = Math.max(1, window.devicePixelRatio || 1);

    canvas.width = Math.round(950 * dpr);
    canvas.height = Math.round(750 * dpr);

    impostaCoordinate();
}

function impostaCoordinate() {
    ctx.setTransform(
        dpr, 0, 0, -dpr,
        475 * dpr, 375 * dpr
    );
}

window.addEventListener("resize", scalaSchermo);
scalaSchermo();


/* ================================================
   COLORI
================================================ */

function colore(rgb, intensita) {
    intensita = Math.max(0, Math.min(1, intensita));
    return rgb.map(c => Math.floor(c * intensita));
}

function css(rgb) {
    return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}


/* ================================================
   PULIZIA
================================================ */

function pulisci() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
}


/* ================================================
   TESTI
================================================ */

function testo(x, y, frase, dimensione, color,
               font = "Arial", stile = "bold") {

    if (!frase) return;

    ctx.save();
    ctx.scale(1, -1);

    ctx.fillStyle = css(color);
    ctx.font = `${stile} ${dimensione}px "${font}", sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    ctx.fillText(frase, x, -y);
    ctx.restore();
}

function testo_graduale(x, y, frase, dimensione,
                        color, progressione,
                        font = "Arial", stile = "bold") {

    progressione = Math.max(0, Math.min(1, progressione));

    const lettere = progressione >= 1
        ? frase.length
        : Math.floor(frase.length * progressione);

    testo(
        x, y,
        frase.slice(0, lettere),
        dimensione,
        color,
        font,
        stile
    );
}


/* ================================================
   PULSANTI
================================================ */

function pulsante(x, y, frase, intensita) {
    ctx.save();

    ctx.fillStyle = "rgb(35,0,8)";
    ctx.strokeStyle = css(colore([180,0,25], intensita));
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.rect(x - 65, y - 23, 130, 46);
    ctx.fill();
    ctx.stroke();

    ctx.restore();

    testo(x, y - 7, frase, 15, colore(BIANCO, intensita));
}


/* ================================================
   VALUTAZIONE A STELLE
================================================ */

function schermata_rating(intensita) {
    pulisci();

    testo_graduale(
        0, 130,
        "Quanto mi vuoi bene da 1 a 5?",
        25,
        colore(ROSSO_CHIARO, intensita),
        intensita
    );

    for (let i = 0; i < 5; i++) {
        const x = -120 + i * 60;

        testo(
            x, -15,
            voto >= i + 1 ? "★" : "☆",
            45,
            voto >= i + 1
                ? colore([255,190,30], intensita)
                : colore([170,130,50], intensita)
        );
    }

    testo(0, -100, "Scegli le stelline...", 14, [170,170,170]);

    if (messaggioRating !== "") {
        testo(
            0, -160,
            messaggioRating,
            17,
            colore(ROSSO_CHIARO, intensita)
        );
    }
}


/* ================================================
   DOMANDE
================================================ */

function schermata_domanda(frase, trascorso) {
    pulisci();

    const comparsa = Math.min(1, trascorso / 1.5);

    const scomparsa = Math.min(
        1,
        Math.max(0, (8 - trascorso) / 1.5)
    );

    let intensita = Math.min(comparsa, scomparsa);

    if (trascorso >= 1.5) {
        intensita = scomparsa;
    }

    testo_graduale(
        0, 100,
        frase,
        27,
        colore(ROSSO_CHIARO, intensita),
        trascorso >= 1.5 ? 1 : comparsa
    );

    pulsante(-100, -30, "SÌ", intensita);
    pulsante(100, -30, "NO", intensita);

    if (messaggioDomanda !== "") {
        testo(
            0, -130,
            messaggioDomanda,
            17,
            colore(ROSSO_CHIARO, intensita)
        );
    }
}


/* ================================================
   ECCOLA QUA
================================================ */

function schermata_attesa(trascorso) {
    pulisci();

    let intensita;

    if (trascorso < 1.5) {
        intensita = trascorso / 1.5;
    } else if (trascorso < 4) {
        intensita = 1;
    } else {
        intensita = Math.max(0, 1 - (trascorso - 4));
    }

    testo_graduale(
        0, 0,
        "Eccola qua...",
        35,
        colore(ROSSO_CHIARO, intensita),
        Math.min(1, trascorso / 1.5)
    );
}


/* ================================================
   SAGOMA DELLA MANO
================================================ */

function aggiungiCurva(punti, x1, y1, x2, y2, x3, y3, passi = 12) {
    const [x0, y0] = punti[punti.length - 1];

    for (let i = 1; i <= passi; i++) {
        const t = i / passi;
        const mt = 1 - t;

        const x =
            mt*mt*mt*x0 +
            3*mt*mt*t*x1 +
            3*mt*t*t*x2 +
            t*t*t*x3;

        const y =
            mt*mt*mt*y0 +
            3*mt*mt*t*y1 +
            3*mt*t*t*y2 +
            t*t*t*y3;

        punti.push([x, y]);
    }
}

function punti_mano(scala, angolo = 0) {
    const p = [
        [-7, -15],
        [-7, -6]
    ];

    // Pollice
    aggiungiCurva(p, -7,-3, -10,-2, -11,0);
    aggiungiCurva(p, -13,2, -12,5, -10,6);
    aggiungiCurva(p, -8,7, -6,4, -4,3);

    // Dito medio alzato
    p.push([-4,17]);
    aggiungiCurva(p, -4,21, 4,21, 4,17);
    p.push([4,3]);

    // Dita piegate
    aggiungiCurva(p, 4,6, 6,8, 8,7);
    aggiungiCurva(p, 10,7, 11,5, 10,3);
    aggiungiCurva(p, 12,4, 14,2, 14,0);
    aggiungiCurva(p, 14,-2, 12,-4, 10,-5);
    aggiungiCurva(p, 8,-7, 7,-8, 7,-10);

    // Lato del pugno e polso
    p.push([7,-15]);

    return p.map(([x,y]) => [
        x * scala * Math.cos(angolo),
        y * scala
    ]);
}


/* ================================================
   DISEGNO DELLA SAGOMA
================================================ */

function disegnaSagoma(punti, riempi = true) {
    ctx.beginPath();
    ctx.moveTo(punti[0][0], punti[0][1]);

    for (let i = 1; i < punti.length; i++) {
        ctx.lineTo(punti[i][0], punti[i][1]);
    }

    ctx.closePath();

    if (riempi) ctx.fill();
    ctx.stroke();
}


/* ================================================
   MANO COLOR PELLE
================================================ */

function disegna_mano_piena(scala, angolo = 0) {
    const punti = punti_mano(scala, angolo);

    ctx.save();

    // Ombra morbida
    ctx.shadowColor = "rgba(70,25,15,0.45)";
    ctx.shadowBlur = 12;
    ctx.shadowOffsetX = 5;
    ctx.shadowOffsetY = -6;

    const gradiente = ctx.createLinearGradient(-150, 240, 150, -200);

    gradiente.addColorStop(0, "#a85f48");
    gradiente.addColorStop(0.25, "#d18a6b");
    gradiente.addColorStop(0.55, "#f0b99a");
    gradiente.addColorStop(0.8, "#e5a183");
    gradiente.addColorStop(1, "#b97059");

    ctx.fillStyle = gradiente;
    ctx.strokeStyle = "#8d4f3d";
    ctx.lineWidth = 2.5;

    disegnaSagoma(punti);

    ctx.restore();

    // Dettagli: unghia del dito medio e pieghe delle dita
    const larghezza = Math.cos(angolo);

    ctx.save();
    ctx.scale(larghezza, 1);

    // Unghia del dito medio
    ctx.beginPath();
    ctx.ellipse(0, 205, 17, 12, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#f7c8b5";
    ctx.fill();

    ctx.strokeStyle = "#c78270";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Riflesso sull'unghia
    ctx.beginPath();
    ctx.ellipse(-3, 209, 7, 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,245,235,0.55)";
    ctx.fill();

    // Pieghe delle dita chiuse
    ctx.beginPath();
    ctx.moveTo(55, 55);
    ctx.quadraticCurveTo(85, 70, 105, 47);

    ctx.moveTo(65, 20);
    ctx.quadraticCurveTo(95, 35, 112, 12);

    ctx.strokeStyle = "rgba(130,65,48,0.55)";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Linea del pollice
    ctx.beginPath();
    ctx.moveTo(-105, 20);
    ctx.quadraticCurveTo(-75, 0, -48, 27);
    ctx.strokeStyle = "rgba(130,65,48,0.45)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Luce sul dorso della mano
    ctx.beginPath();
    ctx.moveTo(-55, -45);
    ctx.quadraticCurveTo(-15, -65, 40, -45);
    ctx.strokeStyle = "rgba(255,225,205,0.35)";
    ctx.lineWidth = 7;
    ctx.stroke();

    ctx.restore();
}


/* ================================================
   DISEGNO PROGRESSIVO DELLA MANO
================================================ */

function disegna_contorno_mano(progressione) {
    const punti = punti_mano(12);

    const quanti = Math.max(
        2,
        Math.floor(punti.length * progressione)
    );

    ctx.beginPath();
    ctx.moveTo(punti[0][0], punti[0][1]);

    for (let i = 1; i < quanti; i++) {
        ctx.lineTo(punti[i][0], punti[i][1]);
    }

    ctx.strokeStyle = css(ROSSO_CHIARO);
    ctx.lineWidth = 3;
    ctx.stroke();
}


/* ================================================
   SCRITTE SULLA MANO
================================================ */

function scritte_mano(progressione) {
    testo_graduale(
        0, -15,
        "Beatrice",
        43,
        [255,220,220],
        progressione,
        "Brush Script MT",
        "italic"
    );

    testo_graduale(
        0, -85,
        "foto tette?",
        15,
        [255,100,115],
        progressione
    );
}


/* ================================================
   LUCI
================================================ */

function disegna_luci(intensita) {
    for (let i = 0; i < 30; i++) {
        const angolo =
            i * 2 * Math.PI / 30 + frame * 0.008;

        const x = 245 * Math.cos(angolo);
        const y = 195 * Math.sin(angolo);

        const pulsazione =
            0.5 + 0.5 * Math.sin(frame * 0.1 + i);

        const luminosita =
            intensita * (0.5 + pulsazione * 0.5);

        ctx.beginPath();
        ctx.arc(x, y, (3 + pulsazione * 5) / 2, 0, Math.PI * 2);

        ctx.fillStyle = css(colore(ROSSO_CHIARO, luminosita));
        ctx.fill();
    }
}


/* ================================================
   FIRMA LOTTY
================================================ */

function mostra_firma(progressione) {
    testo_graduale(
        330, -285,
        "Lotty",
        32,
        colore([230,110,130], progressione),
        progressione,
        "Brush Script MT",
        "italic"
    );
}


/* ================================================
   CAMBIO FASE
================================================ */

function passa_a(nuova_fase) {
    fase = nuova_fase;
    tempoInizio = performance.now();
    frame = 0;
    messaggioDomanda = "";
    pulisci();
}


/* ================================================
   CLICK
================================================ */

function click(event) {
    const rect = canvas.getBoundingClientRect();

    const x =
        (event.clientX - rect.left) * 950 / rect.width - 475;

    const y =
        375 - (event.clientY - rect.top) * 750 / rect.height;

    if (fase === "rating") {
        if (x >= -150 && x <= 150 && y > -70 && y < 50) {

            const posizione = Math.floor((x + 150) / 60) + 1;

            voto = Math.max(1, Math.min(5, posizione));

            const messaggi = {
                1: "SOLO UNA?! Ma come ti permetti?!",
                2: "Due stelline? Mi aspettavo di più!",
                3: "Tre? Va beh, possiamo migliorare...",
                4: "Quasi! Ma manca ancora una stellina!",
                5: "Ecco! Questa è la risposta giusta!"
            };

            messaggioRating = messaggi[voto];

            if (voto === 5) {
                ratingVaiAvanti = true;
                tempoRating = performance.now();
            } else {
                ratingVaiAvanti = false;
            }
        }
    }

    else if (fase === "domanda1" || fase === "domanda2") {

        // Controllo SÌ
        if (
            x >= -165 && x <= -35 &&
            y >= -53 && y <= -7
        ) {
            if (fase === "domanda1") {
                passa_a("domanda2");
            } else {
                passa_a("attesa");
            }
        }

        // Controllo NO
        else if (
            x >= 35 && x <= 165 &&
            y >= -53 && y <= -7
        ) {
            if (fase === "domanda1") {
                messaggioDomanda = "Eh no, non puoi tirarti indietro!";
            } else {
                messaggioDomanda = "Lo sapevo che avresti detto no... riprova!";
            }
        }
    }
}

canvas.addEventListener("pointerdown", event => {
    event.preventDefault();
    click(event);
});


/* ================================================
   ANIMAZIONE PRINCIPALE
================================================ */

function animazione(ora) {
    requestAnimationFrame(animazione);

    if (ora - ultimoFrame < 35) return;
    ultimoFrame = ora;

    const trascorso = (performance.now() - tempoInizio) / 1000;
    frame++;

    if (fase === "rating") {
        schermata_rating(Math.min(1, trascorso / 1.5));

        if (
            ratingVaiAvanti &&
            performance.now() - tempoRating >= 1000
        ) {
            passa_a("domanda1");
        }
    }

    else if (fase === "domanda1") {
        schermata_domanda(
            "Sei pronta a vedere la sorpresa?",
            trascorso
        );

        if (trascorso >= 8) passa_a("domanda2");
    }

    else if (fase === "domanda2") {
        schermata_domanda(
            "Sicura sicura?",
            trascorso
        );

        if (trascorso >= 8) passa_a("attesa");
    }

    else if (fase === "attesa") {
        schermata_attesa(trascorso);

        if (trascorso >= 5) passa_a("mano");
    }

    else if (fase === "mano") {
        pulisci();

        if (trascorso < 3) {
            disegna_contorno_mano(trascorso / 3);
        }

        else if (trascorso < 4.5) {
            disegna_mano_piena(12);
        }

        else if (trascorso < 6.5) {
            disegna_mano_piena(12);
            scritte_mano((trascorso - 4.5) / 2);
        }

        else {
            const pulsazione =
                1 + 0.035 * Math.sin(frame * 0.08);

            const rotazione = frame * 0.025;

            disegna_mano_piena(
                12 * pulsazione,
                rotazione
            );

            scritte_mano(1);
            disegna_luci(1);

            if (trascorso > 9) {
                const progressione = Math.min(
                    1,
                    (trascorso - 9) / 2
                );

                mostra_firma(progressione);
            }
        }
    }
}


/* ================================================
   AVVIO
================================================ */

requestAnimationFrame(animazione);

</script>
</body>
</html>
